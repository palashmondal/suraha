# Suraha — deployment topology (SURAHA_BUILD_PROMPT §12.2).
# Docker Compose on a single Linux VPS. Secrets come from infra/.env (see infra/.env.example).
services:
  app:
    build: { context: ../api, dockerfile: ../infra/php.Dockerfile }
    env_file: [.env]
    depends_on: [postgres]
    # Uploaded files (slider images, avatars, generated certificates) go to Laravel's public
    # disk. Without this volume every rebuild would delete them.
    volumes: [uploads:/app/storage/app/public]
    restart: unless-stopped

  web:
    build:
      context: ../web
      dockerfile: ../infra/web.Dockerfile
      args: [VITE_GOOGLE_MAPS_KEY]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-suraha}
      POSTGRES_USER: ${DB_USERNAME:-suraha}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  # Reverse proxy. TLS is issued per-hostname on demand (HTTP-01), gated by the API — see
  # Caddyfile — so the stock image is enough: no DNS provider module, no wildcard cert.
  proxy:
    image: caddy:2-alpine
    ports: ['80:80', '443:443']
    depends_on: [app, web]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddydata:/data
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddydata:
