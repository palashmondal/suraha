# Suraha — deployment topology (SURAHA_BUILD_PROMPT §12.2).
# Docker Compose on a single Linux VPS. Docker is NOT installed on the current dev
# machine, so this is provided as the deploy target; run `docker compose up` where Docker
# is available. Secrets come from infra/.env (see infra/.env.example).
services:
  app:
    build: { context: ../api, dockerfile: ../infra/php.Dockerfile }
    env_file: [.env]
    depends_on: [postgres, redis]
    restart: unless-stopped

  web:
    build: { context: ../web, dockerfile: ../infra/web.Dockerfile }
    restart: unless-stopped

  worker:
    build: { context: ../api, dockerfile: ../infra/php.Dockerfile }
    command: php artisan horizon
    env_file: [.env]
    depends_on: [redis, postgres]
    restart: unless-stopped

  scheduler:
    build: { context: ../api, dockerfile: ../infra/php.Dockerfile }
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    env_file: [.env]
    depends_on: [redis, postgres]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-suraha}
      POSTGRES_USER: ${DB_USERNAME:-suraha}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Optional: S3-compatible object storage for attachments + certificates.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_KEY:-suraha}
      MINIO_ROOT_PASSWORD: ${S3_SECRET:-secret1234}
    volumes: [miniodata:/data]
    restart: unless-stopped

  # Reverse proxy terminating wildcard TLS for *.suraha.com.bd (Let's Encrypt DNS-01).
  # Caddy shown for brevity; Nginx/Traefik are equally fine.
  proxy:
    image: caddy:2-alpine
    ports: ['80:80', '443:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddydata:/data
    depends_on: [app, web]
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  caddydata:
