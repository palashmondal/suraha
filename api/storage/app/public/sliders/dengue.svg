      <stop offset="0" stop-color="#0d7a6f"/>
      <stop offset="1" stop-color="#04463f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#g1)"/>
  <circle cx="1010" cy="120" r="230" fill="#ffffff" opacity="0.06"/>
