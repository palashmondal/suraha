<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" font-family="'Noto Sans Bengali','Hind Siliguri','Kalpurush',sans-serif">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d2b6b"/>
      <stop offset="1" stop-color="#3a1140"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#g3)"/>
  <circle cx="1010" cy="120" r="230" fill="#ffffff" opacity="0.06"/>
  <circle cx="1080" cy="420" r="150" fill="#ffffff" opacity="0.05"/>
  <!-- "no / stop" ring + graduation cap -->
  <g transform="translate(1055,150) scale(0.62)" opacity="0.92">
    <circle cx="0" cy="0" r="96" fill="none" stroke="#f4a7d8" stroke-width="14"/>
    <line x1="-66" y1="66" x2="66" y2="-66" stroke="#f4a7d8" stroke-width="14"/>
    <g transform="translate(0,-4)" fill="#ffffff">
      <polygon points="0,-40 60,-14 0,12 -60,-14"/>
      <path d="M-34 -3 v28 a34 12 0 0 0 68 0 v-28" fill="#f4a7d8"/>
      <line x1="58" y1="-15" x2="58" y2="26" stroke="#ffffff" stroke-width="4"/>
      <circle cx="58" cy="30" r="6" fill="#ffffff"/>
    </g>
  </g>
  <text x="80" y="150" fill="#f0c9e8" font-size="26" font-weight="600">মহিলা ও শিশু বিষয়ক অধিদপ্তর</text>
  <text x="80" y="240" fill="#ffffff" font-size="56" font-weight="800">বাল্যবিবাহকে না বলুন</text>
  <text x="80" y="300" fill="#f7e6f4" font-size="30" font-weight="500">১৮ বছরের আগে মেয়ের বিয়ে নয়।</text>
  <rect x="80" y="360" width="10" height="54" rx="5" fill="#f4a7d8"/>
  <text x="108" y="398" fill="#ffffff" font-size="30" font-weight="700">উপজেলা প্রশাসন, গলাচিপা</text>
